<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="100%" height="280">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1a1b26"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.6"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .title { font: 800 38px 'Segoe UI', 'Inter', Ubuntu, sans-serif; fill: #f8fafc; letter-spacing: -0.5px; }
    .accent { fill: url(#accentGrad); }
    .subtitle { font: 600 17px 'Segoe UI', 'Inter', Ubuntu, sans-serif; fill: #94a3b8; letter-spacing: 0.4px; }
    .mono { font: 600 12px 'JetBrains Mono', 'Fira Code', 'Consolas', monospace; fill: #38bdf8; letter-spacing: 1.5px; }
    .pill-text { font: 600 11.5px 'JetBrains Mono', 'Fira Code', 'Consolas', monospace; fill: #e2e8f0; letter-spacing: 1px; }
    .chip-text { font: 600 12px 'Segoe UI', Ubuntu, sans-serif; fill: #cbd5e1; }
    .pulse { animation: pulseAnim 2.5s infinite ease-in-out; }
    .float1 { animation: floatAnim 5s infinite ease-in-out; }
    .float2 { animation: floatAnim 6s infinite ease-in-out reverse; }
    @keyframes pulseAnim {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
    @keyframes floatAnim {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
  </style>

  <!-- Background Card -->
  <rect width="1000" height="280" rx="16" fill="url(#bgGrad)"/>
  <rect width="1000" height="280" rx="16" fill="url(#grid)"/>
  <rect x="1" y="1" width="998" height="278" rx="15" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- Top & Bottom Neon Accent Lines -->
  <rect x="150" y="0" width="700" height="2.5" fill="url(#glowGrad)"/>
  <rect x="200" y="277.5" width="600" height="2.5" fill="url(#glowGrad)"/>

  <!-- Ambient Neural Network Nodes (Right Side) -->
  <g opacity="0.55" class="float1">
    <line x1="760" y1="65" x2="850" y2="110" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.4"/>
    <line x1="850" y1="110" x2="920" y2="70" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.4"/>
    <line x1="850" y1="110" x2="880" y2="195" stroke="#c084fc" stroke-width="1.2" stroke-opacity="0.4"/>
    <line x1="760" y1="65" x2="790" y2="175" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.4"/>
    <line x1="790" y1="175" x2="880" y2="195" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.4"/>
    <line x1="880" y1="195" x2="945" y2="150" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.4"/>
    <line x1="920" y1="70" x2="945" y2="150" stroke="#c084fc" stroke-width="1.2" stroke-opacity="0.4"/>

    <circle cx="760" cy="65" r="5" fill="#38bdf8" filter="url(#glow)"/>
    <circle cx="850" cy="110" r="7" fill="#818cf8" filter="url(#glow)"/>
    <circle cx="920" cy="70" r="4.5" fill="#c084fc" filter="url(#glow)"/>
    <circle cx="790" cy="175" r="5.5" fill="#38bdf8" filter="url(#glow)"/>
    <circle cx="880" cy="195" r="6.5" fill="#c084fc" filter="url(#glow)"/>
    <circle cx="945" cy="150" r="4.5" fill="#38bdf8" filter="url(#glow)"/>
  </g>

  <!-- Status Pill -->
  <g transform="translate(56, 36)">
    <rect width="430" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
    <circle cx="16" cy="14" r="4.5" fill="#10b981" class="pulse"/>
    <text x="30" y="18" class="pill-text">B.TECH AI &amp; ML // CBIT HYDERABAD // @PRAVEEN-79</text>
  </g>

  <!-- Main Heading -->
  <text x="56" y="114" class="title">
    Hey there, I'm <tspan class="accent">Praveen Kumar</tspan> 👋
  </text>

  <!-- Role Subtitle -->
  <text x="56" y="150" class="subtitle">
    AI/ML Engineer  •  Python Developer  •  Building Intelligent Applications
  </text>

  <!-- Terminal Tagline -->
  <text x="56" y="182" class="mono">
    &gt; Exploring LLMs (Qwen 2.5), RAG Pipelines, Deep Learning &amp; Full-Stack Systems_
  </text>

  <!-- Feature Chips Row -->
  <g transform="translate(56, 210)" class="float2">
    <rect x="0" y="0" width="165" height="32" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5"/>
    <text x="16" y="20" class="chip-text">⚡ LLMs &amp; RAG Pipelines</text>

    <rect x="180" y="0" width="180" height="32" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="1" stroke-opacity="0.5"/>
    <text x="196" y="20" class="chip-text">🧠 CNN-BiLSTM &amp; ViT</text>

    <rect x="375" y="0" width="175" height="32" rx="8" fill="#1e293b" stroke="#c084fc" stroke-width="1" stroke-opacity="0.5"/>
    <text x="391" y="20" class="chip-text">🐍 Python &amp; Full-Stack</text>
  </g>
</svg>

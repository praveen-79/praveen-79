<svg xmlns="http://www.w3.org/2000/svg" width="340" height="195" viewBox="0 0 340 195" fill="none" role="img" aria-label="Most Used Languages">
  <style>
    .bg { fill: #1a1b27; stroke: #292e42; stroke-width: 1.5px; }
    .header { font: 700 17px 'Segoe UI', Ubuntu, sans-serif; fill: #70a5fd; }
    .lang { font: 600 12.5px 'Segoe UI', Ubuntu, sans-serif; fill: #c0caf5; }
    .pct { font: 600 12px 'Segoe UI', Ubuntu, sans-serif; fill: #7aa2f7; }
  </style>
  <rect x="1" y="1" width="338" height="193" rx="10" class="bg"/>
  <text x="24" y="34" class="header">Most Used Languages</text>

  <!-- Multi-segment Language Bar (total width = 292) -->
  <g transform="translate(24, 52)">
    <clipPath id="barClip">
      <rect x="0" y="0" width="292" height="10" rx="5"/>
    </clipPath>
    <g clip-path="url(#barClip)">
      <rect x="0" y="0" width="170" height="10" fill="#3572A5"/>
      <rect x="170" y="0" width="54" height="10" fill="#f1e05a"/>
      <rect x="224" y="0" width="38" height="10" fill="#e34c26"/>
      <rect x="262" y="0" width="18" height="10" fill="#563d7c"/>
      <rect x="280" y="0" width="12" height="10" fill="#4479A1"/>
    </g>
  </g>

  <!-- Language Legend -->
  <g transform="translate(24, 88)">
    <!-- Col 1 -->
    <circle cx="6" cy="-4" r="5" fill="#3572A5"/>
    <text x="18" y="0" class="lang">Python</text>
    <text x="88" y="0" class="pct">58.2%</text>

    <circle cx="6" cy="26" r="5" fill="#e34c26"/>
    <text x="18" y="30" class="lang">HTML5</text>
    <text x="88" y="30" class="pct">13.0%</text>

    <circle cx="6" cy="56" r="5" fill="#4479A1"/>
    <text x="18" y="60" class="lang">SQL / SQLite</text>
    <text x="105" y="60" class="pct">4.2%</text>

    <!-- Col 2 -->
    <circle cx="166" cy="-4" r="5" fill="#f1e05a"/>
    <text x="178" y="0" class="lang">JavaScript</text>
    <text x="255" y="0" class="pct">18.5%</text>

    <circle cx="166" cy="26" r="5" fill="#563d7c"/>
    <text x="178" y="30" class="lang">CSS3</text>
    <text x="255" y="30" class="pct">6.1%</text>

    <circle cx="166" cy="56" r="5" fill="#38bdae"/>
    <text x="178" y="60" class="lang">Jupyter / ML</text>
    <text x="265" y="60" class="pct">AI</text>
  </g>
</svg>